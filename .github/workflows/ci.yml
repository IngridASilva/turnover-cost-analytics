name: CI

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
  schedule:
    # Scoring mensal: todo dia 2 às 6h UTC, depois do fechamento da folha.
    - cron: "0 6 2 * *"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest tests -q

  scoring:
    needs: testes
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e .
      - run: turnover-pipeline --base data_base --saida reports
      - uses: actions/upload-artifact@v4
        with:
          name: scoring-turnover
          path: reports/
          retention-days: 90
