[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turnover-cost-analytics"
version = "0.1.0"
description = "Propensão de saída calibrada e custo financeiro do turnover"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26", "pandas>=2.2", "pyarrow>=15.0", "PyYAML>=6.0",
    "scikit-learn>=1.6", "xgboost>=2.0", "shap>=0.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
turnover-pipeline = "turnover.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 92
target-version = "py311"
